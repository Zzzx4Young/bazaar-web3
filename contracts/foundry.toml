[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc = ".tools/solc-0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "@safe-global/=node_modules/@safe-global/"]
fs_permissions = [{ access = "read-write", path = "./.tmp" }]
[fuzz]
runs = 128
[invariant]
runs = 64
depth = 48
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
single_line_statement_blocks = "multi"
