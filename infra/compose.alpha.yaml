name: bazaar-alpha

services:
  postgres:
    image: postgres:17.11-bookworm
    shm_size: 128mb
    environment:
      POSTGRES_USER: bazaar_admin
      POSTGRES_DB: bazaar_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - alpha-postgres-data:/var/lib/postgresql/data
    secrets: [postgres_password]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  bootstrap:
    image: postgres:17.11-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    command: ['/bin/bash', '/usr/local/bin/bootstrap-alpha.sh']
    secrets: [postgres_password]
    volumes:
      - alpha-app-config:/run/config
      - ./scripts/bootstrap-alpha.sh:/usr/local/bin/bootstrap-alpha.sh:ro
    restart: 'no'

  migrate:
    build:
      context: ../backend
      target: migrate
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_FILE: /run/config/migration_database_url
      DATABASE_RUNTIME_ROLE: bazaar_runtime
    volumes:
      - alpha-app-config:/run/config:ro
    restart: 'no'

  api:
    build:
      context: ../backend
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_FILE: /run/config/runtime_database_url
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      HOST: 0.0.0.0
      PORT: 3001
    volumes:
      - alpha-app-config:/run/config:ro
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health/ready',{method:'POST',headers:{origin:process.env.APP_ORIGIN,'content-type':'application/json'},body:'{}'}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ../frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: http://api:3001
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'

volumes:
  alpha-postgres-data:
  alpha-app-config:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
