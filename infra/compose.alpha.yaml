name: bazaar-alpha

services:
  postgres:
    image: postgres:17.11-bookworm
    shm_size: 128mb
    environment:
      POSTGRES_USER: bazaar_admin
      POSTGRES_DB: bazaar_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - alpha-postgres-data:/var/lib/postgresql/data
    secrets: [postgres_password]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  bootstrap:
    image: postgres:17.11-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    command: ['/bin/bash', '/usr/local/bin/bootstrap-alpha.sh']
    secrets: [postgres_password]
    volumes:
      - alpha-app-config:/run/config
      - ./scripts/bootstrap-alpha.sh:/usr/local/bin/bootstrap-alpha.sh:ro
    restart: 'no'

  migrate:
    build:
      context: ../backend
      target: migrate
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_FILE: /run/config/migration_database_url
      DATABASE_RUNTIME_ROLE: bazaar_runtime
    volumes:
      - alpha-app-config:/run/config:ro
    restart: 'no'

  api:
    build:
      context: ../backend
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-hot:
        condition: service_healthy
      garage-cold:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/config/runtime_database_url
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      HOST: 0.0.0.0
      PORT: 3001
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      API_MAX_IN_FLIGHT: ${API_MAX_IN_FLIGHT:-200}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-3000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-10000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-3000}
      GARAGE_HOT_ENDPOINT: http://garage-hot:3900
      GARAGE_HOT_PUBLIC_ENDPOINT: ${GARAGE_HOT_PUBLIC_ENDPOINT:-http://localhost:3900}
      GARAGE_COLD_ENDPOINT: http://garage-cold:3900
      GARAGE_HOT_ACCESS_KEY_ID_FILE: /run/media-secrets/hot_access_key_id
      GARAGE_HOT_SECRET_KEY_FILE: /run/media-secrets/hot_secret_key
      GARAGE_COLD_ACCESS_KEY_ID_FILE: /run/media-secrets/cold_access_key_id
      GARAGE_COLD_SECRET_KEY_FILE: /run/media-secrets/cold_secret_key
    volumes:
      - alpha-app-config:/run/config:ro
      - ./.secrets/garage-app:/run/media-secrets:ro
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health/ready',{method:'POST',headers:{origin:process.env.APP_ORIGIN,'content-type':'application/json'},body:'{}'}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ../frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: http://api:3001
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'

  garage-hot:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ['/garage', 'server']
    environment:
      GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret
    secrets:
      - source: garage_hot_rpc_secret
        target: garage_rpc_secret
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - alpha-garage-hot-meta:/var/lib/garage/meta
      - alpha-garage-hot-data:/var/lib/garage/data
    ports:
      - '127.0.0.1:${GARAGE_HOT_PORT:-3900}:3900'
    healthcheck:
      test: [CMD, /garage, health, -q]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  garage-cold:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ['/garage', 'server']
    environment:
      GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret
    secrets:
      - source: garage_cold_rpc_secret
        target: garage_rpc_secret
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - alpha-garage-cold-meta:/var/lib/garage/meta
      - alpha-garage-cold-data:/var/lib/garage/data
    # Loopback only: the host development API needs this endpoint.
    ports:
      - '127.0.0.1:${GARAGE_COLD_PORT:-3903}:3900'
    healthcheck:
      test: [CMD, /garage, health, -q]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  archive-worker:
    build:
      context: ../backend
      target: runtime
    command: ['node', 'scripts/archive-order-media.mjs', '--loop']
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-hot:
        condition: service_healthy
      garage-cold:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/config/runtime_database_url
      GARAGE_HOT_ENDPOINT: http://garage-hot:3900
      GARAGE_HOT_PUBLIC_ENDPOINT: ${GARAGE_HOT_PUBLIC_ENDPOINT:-http://localhost:3900}
      GARAGE_COLD_ENDPOINT: http://garage-cold:3900
      GARAGE_HOT_ACCESS_KEY_ID_FILE: /run/media-secrets/hot_access_key_id
      GARAGE_HOT_SECRET_KEY_FILE: /run/media-secrets/hot_secret_key
      GARAGE_COLD_ACCESS_KEY_ID_FILE: /run/media-secrets/cold_access_key_id
      GARAGE_COLD_SECRET_KEY_FILE: /run/media-secrets/cold_secret_key
      ORDER_IMAGE_ARCHIVE_AFTER_DAYS: ${ORDER_IMAGE_ARCHIVE_AFTER_DAYS:-90}
      ORDER_IMAGE_ARCHIVE_SCAN_SECONDS: ${ORDER_IMAGE_ARCHIVE_SCAN_SECONDS:-60}
    volumes:
      - alpha-app-config:/run/config:ro
      - ./.secrets/garage-app:/run/media-secrets:ro
    restart: unless-stopped

volumes:
  alpha-postgres-data:
  alpha-app-config:
  alpha-garage-hot-meta:
  alpha-garage-hot-data:
  alpha-garage-cold-meta:
  alpha-garage-cold-data:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  garage_hot_rpc_secret:
    file: ./.secrets/garage_hot_rpc_secret
  garage_cold_rpc_secret:
    file: ./.secrets/garage_cold_rpc_secret
