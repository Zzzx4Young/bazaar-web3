global
  maxconn 256

defaults
  mode tcp
  timeout connect 3s
  timeout client 60s
  timeout server 60s
  timeout check 2s

listen postgres_writer
  bind :5432
  option httpchk
  http-check send meth GET uri /primary
  http-check expect status 200
  # Route only after the first primary health check, including proxy restarts.
  default-server init-state fully-down inter 1s fall 1 rise 1 on-marked-down shutdown-sessions
  server pg1 pg1:5432 check port 8008
  server pg2 pg2:5432 check port 8008
  server pg3 pg3:5432 check port 8008
