# Local Linux transport validation only; host networking does not change host configuration.
x-ingress: &ingress
  image: haproxy:3.2-bookworm@sha256:baecd003ae5c2376e58d04a5b2ffc7d82d30e9bebe2869f76222b819f719dee3
  network_mode: host
  restart: 'no'
  environment:
    APP_ORIGIN: ${APP_ORIGIN:?Set exact frontend origin}
    API_ONE_ADDRESS: ${API_ONE_ADDRESS:?Set isolated API one address}
    API_TWO_ADDRESS: ${API_TWO_ADDRESS:?Set isolated API two address}
  volumes:
    - ./http/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  ingress1:
    <<: *ingress
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set exact frontend origin}
      API_ONE_ADDRESS: ${API_ONE_ADDRESS:?Set isolated API one address}
      API_TWO_ADDRESS: ${API_TWO_ADDRESS:?Set isolated API two address}
      HTTP_BIND_ADDRESS: 127.0.0.1:${HTTP_ONE_PORT:?Set isolated HTTP one port}
  ingress2:
    <<: *ingress
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set exact frontend origin}
      API_ONE_ADDRESS: ${API_ONE_ADDRESS:?Set isolated API one address}
      API_TWO_ADDRESS: ${API_TWO_ADDRESS:?Set isolated API two address}
      HTTP_BIND_ADDRESS: 127.0.0.1:${HTTP_TWO_PORT:?Set isolated HTTP two port}
