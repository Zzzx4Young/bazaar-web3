name: bazaar-media-recovery

x-garage: &garage
  image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
  command: ['/garage', 'server']
  restart: 'no'

services:
  source-hot:
    <<: *garage
    environment: { GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret }
    secrets: [{ source: garage_hot_rpc_secret, target: garage_rpc_secret }]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - source-hot-meta:/var/lib/garage/meta
      - source-hot-data:/var/lib/garage/data
    ports: ['127.0.0.1:3910:3900']
  source-cold:
    <<: *garage
    environment: { GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret }
    secrets: [{ source: garage_cold_rpc_secret, target: garage_rpc_secret }]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - source-cold-meta:/var/lib/garage/meta
      - source-cold-data:/var/lib/garage/data
    ports: ['127.0.0.1:3911:3900']
  restored-hot:
    <<: *garage
    profiles: [restore]
    environment: { GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret }
    secrets: [{ source: garage_hot_rpc_secret, target: garage_rpc_secret }]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - restored-hot-meta:/var/lib/garage/meta
      - restored-hot-data:/var/lib/garage/data
    ports: ['127.0.0.1:3912:3900']
  restored-cold:
    <<: *garage
    profiles: [restore]
    environment: { GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret }
    secrets: [{ source: garage_cold_rpc_secret, target: garage_rpc_secret }]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - restored-cold-meta:/var/lib/garage/meta
      - restored-cold-data:/var/lib/garage/data
    ports: ['127.0.0.1:3913:3900']

volumes:
  source-hot-meta:
  source-hot-data:
  source-cold-meta:
  source-cold-data:
  restored-hot-meta:
  restored-hot-data:
  restored-cold-meta:
  restored-cold-data:

secrets:
  garage_hot_rpc_secret: { file: ./.secrets/garage_hot_rpc_secret }
  garage_cold_rpc_secret: { file: ./.secrets/garage_cold_rpc_secret }
