name: bazaar-api

services:
  migrate:
    image: ${BAZAAR_MIGRATE_IMAGE:?Set BAZAAR_MIGRATE_IMAGE to an immutable image reference}
    restart: "no"
    environment:
      DATABASE_URL_FILE: /run/secrets/migration_database_url
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:-bazaar_runtime}
    secrets: [migration_database_url]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  api:
    image: ${BAZAAR_API_IMAGE:?Set BAZAAR_API_IMAGE to an immutable image reference}
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_FILE: /run/secrets/runtime_database_url
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the exact frontend origin}
      HOST: 0.0.0.0
      PORT: 3001
    secrets: [runtime_database_url]
    ports:
      - 127.0.0.1:${API_PORT:-3001}:3001
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health/ready',{method:'POST',headers:{origin:process.env.APP_ORIGIN,'content-type':'application/json'},body:'{}'}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  migration_database_url:
    file: ${MIGRATION_DATABASE_URL_FILE:?Set MIGRATION_DATABASE_URL_FILE}
  runtime_database_url:
    file: ${RUNTIME_DATABASE_URL_FILE:?Set RUNTIME_DATABASE_URL_FILE}
