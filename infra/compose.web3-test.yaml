name: bazaar-web3-private-test
services:
  garage-private:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ['/garage', 'server']
    restart: 'no'
    environment: { GARAGE_RPC_SECRET_FILE: /run/secrets/private_rpc }
    secrets: [{source: private_rpc, target: private_rpc}]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - private-meta:/var/lib/garage/meta
      - private-data:/var/lib/garage/data
    ports: ['127.0.0.1:${PRIVATE_GARAGE_TEST_PORT:-55436}:3900']
  checker-profile:
    profiles: [checker]
    build: ../backend/file-checker
    image: bazaar-web3-private-check:t05
    network_mode: none
    read_only: true
    user: '65532:65532'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    cpus: 1
    mem_limit: 4000000000
    memswap_limit: 4000000000
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64000000']
    volumes: ['${PRIVATE_CHECK_INPUT_FILE:?set isolated input file}:/input/object:ro']
    command: ['/input/object', 'application/zip']
volumes:
  private-meta:
  private-data:
secrets:
  private_rpc: {file: '${PRIVATE_GARAGE_RPC_SECRET_FILE:?set isolated RPC secret file}'}
