# Dedicated DB-10 database: separate project, port and persistent volume.
name: bazaar-validation
services:
  postgres-validation:
    image: postgres:17.11-bookworm
    restart: 'no'
    shm_size: 128mb
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: bazaar_validation_admin
      POSTGRES_DB: bazaar_persistence
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_test_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - validation-data:/var/lib/postgresql/data
    secrets:
      - postgres_test_password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  validation-data:
secrets:
  postgres_test_password:
    file: ./.secrets/postgres_test_password
