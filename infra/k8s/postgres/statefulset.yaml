apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bazaar-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazaar-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        # UID/GID of postgres in the pinned Debian image; recheck on image changes.
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11-bookworm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bazaar_admin
            - name: POSTGRES_DB
              value: bazaar_dev
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/password
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            exec:
              command: [pg_isready, -h, '127.0.0.1', -U, bazaar_admin, -d, bazaar_dev]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -h, '127.0.0.1', -U, bazaar_admin, -d, bazaar_dev]
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: password
              mountPath: /run/secrets/postgres
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: password
          secret:
            secretName: postgres-credentials
            defaultMode: 0440
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # Uses the cluster default StorageClass; set explicitly if none exists.
        resources:
          requests:
            storage: 10Gi
