# Local transport validation; TLS and an external redundant endpoint are separate gates.
global
  maxconn 1000

defaults
  mode http
  retries 0
  timeout connect 3s
  timeout client 30s
  timeout server 5s
  timeout http-request 5s
  timeout queue 1s
  timeout check 2s

frontend api_ingress
  bind "${HTTP_BIND_ADDRESS}"
  http-request del-header Forwarded
  http-request del-header X-Forwarded-For
  http-request del-header X-Real-IP
  http-request del-header X-Capacity-Client
  http-request set-header X-Forwarded-For %[src]
  default_backend writable_api

backend writable_api
  balance roundrobin
  option httpchk
  http-check send meth POST uri /api/health/ready ver HTTP/1.1 hdr Host bazaar-api hdr Origin "${APP_ORIGIN}" hdr Content-Type application/json body "{}"
  http-check expect status 200
  default-server init-state fully-down inter 1s fall 1 rise 1
  server api1 "${API_ONE_ADDRESS}" check
  server api2 "${API_TWO_ADDRESS}" check
