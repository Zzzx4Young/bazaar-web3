name: Locked Bazaar tools
description: Install and record exact Node/npm and locked package dependencies
inputs:
  frontend:
    description: Install frontend dependencies
    default: 'false'
  contracts:
    description: Install Forge, Anvil and Solidity source dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '22.23.1'
        cache: npm
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json
          contracts/package-lock.json
    - shell: bash
      run: |
        npm install --global npm@10.9.8
        test "$(node --version)" = v22.23.1
        test "$(npm --version)" = 10.9.8
        node backend/scripts/record-ci-provenance.mjs
        npm --prefix backend ci
    - if: inputs.frontend == 'true'
      shell: bash
      run: npm --prefix frontend ci
    - if: inputs.contracts == 'true'
      shell: bash
      run: npm --prefix contracts ci
