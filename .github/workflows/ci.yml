name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Install locked dependencies
        run: npm ci
      - name: Generate and build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Build deployment images
        working-directory: .
        run: |
          docker build --target runtime --build-arg VCS_REF="$GITHUB_SHA" -t bazaar-api:ci backend
          docker build --target migrate --build-arg VCS_REF="$GITHUB_SHA" -t bazaar-api-migrate:ci backend
      - name: Start isolated PostgreSQL
        working-directory: .
        run: |
          bash infra/scripts/init-secrets.sh
          docker compose -f infra/compose.yaml --profile test up -d --wait --wait-timeout 120 postgres-test
      - name: Database integration tests
        run: node scripts/with-test-db.mjs
      - name: Deployment image acceptance
        run: node scripts/with-test-db.mjs node scripts/check-deployment-images.mjs
      - name: Install frontend browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Alpha browser acceptance
        run: node scripts/check-i5-browser.mjs
        env:
          I5_BROWSER_PORT: '3939'
      - name: Database service status on failure
        if: failure()
        working-directory: .
        run: docker compose -f infra/compose.yaml --profile test ps -a
      - name: Stop test database
        if: always()
        working-directory: .
        run: docker compose -f infra/compose.yaml --profile test stop postgres-test
